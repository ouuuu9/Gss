name: 毕设CI - 智慧码头进港预约系统

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Maven阿里云镜像
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
      <settings>
        <mirrors>
          <mirror>
            <id>aliyunmaven</id>
            <mirrorOf>external:*</mirrorOf>
            <name>阿里云中央仓库</name>
            <url>https://maven.aliyun.com/repository/public</url>
          </mirror>
        </mirrors>
      </settings>
      EOF

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven编译打包（跳过测试）
        run: cd backend && mvn -B clean package -DskipTests

      - name: 上传后端Jar包制品
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Node.js & 淘宝镜像
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖并打包
        run: |
          cd frontend
          npm config set registry https://registry.npmmirror.com
          npm ci
          npm run build

      - name: 上传前端dist制品
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
