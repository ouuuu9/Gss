server:
  port: 8080
  servlet:
    context-path: /

    encoding:
      charset: UTF-8
      force: true
      force-response: true

spring:
  application:
    name: gss-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gss?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: hzqxm0618

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gss.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  # HS256 要求密钥至少 32 字节，生产环境请更换
  secret: gss-terminal-jwt-secret-key-2026-0123456789
  # 有效期（毫秒），默认 12 小时
  expiration: 43200000

# 业务参数
gss:
  fee:
    # 还重单（GR-F）收费金额（元/单，进闸前须缴清）
    amount: 50.00
    # 提重单（PI-F）收费金额（元/单，出闸前须缴清）
    pickup-amount: 80.00

logging:
  level:
    com.gss: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.gss.controller
